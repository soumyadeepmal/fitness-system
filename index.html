<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="mobile-web-app-capable" content="yes">
<title>Fitness System</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#070b16; --panel:#0d1626; --panel2:#111f36; --line:#1e3a5f;
  --glow:#35c4ff; --text:#dceaff; --dim:#7ea0c4; --good:#3ddc97;
  --warn:#ffb347; --bad:#ff5d6c; --xp:#8a6bff;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text); font-family:system-ui,'Segoe UI',Roboto,sans-serif;}
body{min-height:100vh; padding-bottom:76px;}
.topbar{display:flex; align-items:center; gap:8px; padding:14px 16px; border-bottom:1px solid var(--line);
  letter-spacing:2px; font-weight:700; font-size:13px; color:var(--glow);}
.topbar .ver{margin-left:auto; color:var(--dim); font-weight:400; font-size:11px;}
.credit{text-align:center; font-size:9px; letter-spacing:2px; color:var(--dim); padding:4px 0 0; text-transform:uppercase;}
main{padding:16px; max-width:560px; margin:0 auto;}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid var(--line);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  padding:16px; margin-bottom:16px;}
.ptitle{font-size:11px; letter-spacing:2px; color:var(--glow); margin-bottom:12px;}
.levelwrap{text-align:center; padding:8px 0 4px;}
.levelnum{font-size:56px; font-weight:800; color:var(--glow); text-shadow:0 0 18px rgba(53,196,255,.55); line-height:1;}
.lvllabel{font-size:11px; letter-spacing:3px; color:var(--dim); margin-top:2px;}
.rank{display:inline-block; margin-top:10px; padding:3px 14px; border:1px solid var(--glow); color:var(--glow);
  font-size:12px; letter-spacing:2px;}
.xpbar{height:10px; background:#0a1220; border:1px solid var(--line); margin-top:14px;}
.xpfill{height:100%; background:linear-gradient(90deg,var(--xp),var(--glow)); box-shadow:0 0 10px rgba(53,196,255,.6); transition:width .4s;}
.xptext{font-size:11px; color:var(--dim); margin-top:6px; text-align:right;}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.stat{background:#0a1220; border:1px solid var(--line); padding:10px 4px; text-align:center;}
.stat b{display:block; font-size:20px; color:var(--text);}
.stat span{font-size:9px; letter-spacing:1px; color:var(--dim);}
.quest{display:flex; align-items:center; gap:10px; padding:10px 8px; border:1px solid var(--line); margin-bottom:8px; background:#0a1220;}
.quest .qxp{margin-left:auto; font-size:11px; color:var(--xp); white-space:nowrap;}
.quest.done{border-color:var(--good);} .quest.done .qxp{color:var(--good);}
.qbox{width:18px; height:18px; border:1px solid var(--dim); flex:none; display:inline-flex; align-items:center; justify-content:center; font-size:12px; color:var(--good);}
.quest.done .qbox{border-color:var(--good);}
.banner{border:1px solid var(--bad); color:var(--bad); background:rgba(255,93,108,.08); padding:12px; margin-bottom:16px; font-size:13px; letter-spacing:1px;}
label.f{display:block; font-size:11px; letter-spacing:1px; color:var(--dim); margin:12px 0 4px;}
input[type=text],input[type=number],input[type=time]{width:100%; background:#0a1220; border:1px solid var(--line); color:var(--text);
  padding:10px; font-size:15px; border-radius:0; outline:none;}
input:focus{border-color:var(--glow);}
.chips{display:flex; gap:8px; flex-wrap:wrap;}
.chip{padding:8px 14px; border:1px solid var(--line); background:#0a1220; color:var(--dim); font-size:13px; cursor:pointer;}
.chip.on{border-color:var(--glow); color:var(--glow); box-shadow:0 0 8px rgba(53,196,255,.35);}
.btn{display:inline-block; width:100%; padding:12px; margin-top:14px; background:transparent; border:1px solid var(--glow);
  color:var(--glow); font-size:14px; letter-spacing:2px; cursor:pointer; text-align:center;}
.btn:active{background:rgba(53,196,255,.12);}
.btn.ghost{border-color:var(--line); color:var(--dim);}
.saved{font-size:11px; color:var(--good); margin-top:10px; min-height:14px; text-align:right;}
.note{font-size:12px; color:var(--dim); line-height:1.6; margin-top:10px;}
.plan-day{display:flex; gap:10px; padding:10px 8px; border:1px solid var(--line); margin-bottom:8px; background:#0a1220; font-size:13px; line-height:1.5;}
.plan-day b{color:var(--glow); min-width:34px;}
.photos-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px;}
.photos-grid img{width:100%; aspect-ratio:3/4; object-fit:cover; border:1px solid var(--line); display:block; cursor:pointer;}
.pdate{font-size:10px; color:var(--dim); text-align:center; margin-top:4px;}
.compare{display:flex; gap:10px;} .compare>div{flex:1; min-width:0;}
.compare img{width:100%; aspect-ratio:3/4; object-fit:cover; border:1px solid var(--line); cursor:pointer;}
.tabs{position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--panel); border-top:1px solid var(--line); z-index:10;}
.tabs a{flex:1; text-align:center; padding:14px 0 16px; color:var(--dim); font-size:10px; letter-spacing:1px; text-decoration:none;}
.tabs a.on{color:var(--glow); box-shadow:inset 0 2px 0 var(--glow);}
.viewer{position:fixed; inset:0; background:rgba(4,7,14,.96); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.viewer[hidden]{display:none;}
.viewer img{max-width:94vw; max-height:76vh; object-fit:contain;}
.vbar{display:flex; gap:18px; margin-top:16px;}
.vbar button{background:none; border:1px solid var(--line); color:var(--text); padding:10px 16px; font-size:13px; cursor:pointer;}
.chart{width:100%;} .chart polyline{stroke:var(--glow); stroke-width:2; fill:none;}
.chart .grid{stroke:var(--line); stroke-width:1;}
.fbl{font-size:13px; line-height:1.7; padding:6px 0; border-bottom:1px solid var(--line);}
.fbl:last-child{border-bottom:0;}
.fbl::before{content:'▸ '; color:var(--glow);}
.small{font-size:11px; color:var(--dim);}
h2.sec{font-size:12px; letter-spacing:2px; color:var(--glow); margin:4px 0 12px;}
</style>
</head>
<body>
<header class="topbar"><span>◈</span> FITNESS SYSTEM <span class="ver">v1.0</span></header>
<div class="credit">Made by Soumyadeep</div>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div class="viewer" id="viewer" hidden>
  <img id="vimg" alt="Progress photo">
  <div class="vbar"><button id="vprev">◀</button><button id="vclose">CLOSE</button><button id="vnext">▶</button></div>
</div>
<script src="app.js"></script>
</body>
</html>
